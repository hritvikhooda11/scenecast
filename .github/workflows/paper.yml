name: paper

on:
  push:
    branches: [main]
    paths: ["paper/**", "assets/**", ".github/workflows/paper.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: scenecast.tex
          working_directory: paper
      - uses: actions/upload-artifact@v4
        with:
          name: scenecast-paper
          path: paper/scenecast.pdf
