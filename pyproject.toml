[project]
name = "scenecast"
version = "0.1.0"
description = "Multimodal motion forecasting for driving scenes with a vectorized scene transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "pillow>=10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scenecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
